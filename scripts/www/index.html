<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>简易计算器</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f2f4;font-family:Arial,"Microsoft YaHei",sans-serif;color:#202124}.calculator{width:min(360px,94vw);padding:18px;background:#fff;border:1px solid #d8dbe0;border-radius:18px;box-shadow:0 12px 38px #1e293b20}.top{height:45px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;border-bottom:1px solid #e5e7eb;margin-bottom:12px;font-size:14px;color:#666}.brand{font-weight:700;color:#30343b}.mode{text-align:center}.memory{display:flex;justify-content:flex-end;gap:8px}.memory button{border:0;background:#f0f1f3;border-radius:7px;padding:7px 10px;color:#555;cursor:pointer}.screen{height:150px;border:1px solid #e0e3e8;border-radius:10px;margin-bottom:14px;overflow:hidden}.tools{height:54px;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #e0e3e8}.tool-cell{min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px}.tool-cell+.tool-cell{border-left:1px solid #e0e3e8;flex-direction:column;gap:4px}.rate-label{font-size:12px;color:#777}.rate-input{width:70px;border:0;border-bottom:1px solid #cbd0d8;text-align:center;font-size:15px}.rate-input:disabled{color:#777;border-bottom-color:transparent}.tool-button{border:0;border-radius:7px;padding:7px 9px;background:#f0f1f3;color:#444;cursor:pointer;font-size:13px}.readout{height:95px;padding:9px 14px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;overflow:hidden}.expression{font-size:16px;color:#777;min-height:22px;width:100%;text-align:left;max-width:100%;overflow-y:auto;overflow-x:hidden;overflow-wrap:anywhere;white-space:normal}.display{font-size:38px;font-weight:500;max-width:100%;overflow:hidden;white-space:nowrap}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.keys button{height:58px;border:0;border-radius:10px;background:#f0f1f3;font-size:23px;color:#24272c;cursor:pointer;transition:filter .1s,transform .1s}.keys button:hover{filter:brightness(.96)}.keys button:active{transform:scale(.96)}.keys .op{background:#e8edf5;color:#2358a5}.keys .clear{background:#fce8e6;color:#c0392b}.keys .equal{background:#2864dc;color:white}.keys .zero{grid-column:span 2}
.calculator{width:min(440px,96vw);padding:16px}.top{grid-template-columns:1.2fr .7fr 1fr}.screen{height:auto;min-height:150px}.tools{height:76px;grid-template-columns:minmax(0,1fr) 132px}.tool-cell+.tool-cell{padding:5px 8px}.tool-button{width:100%;min-height:28px;padding:5px 7px}.readout{height:auto;min-height:100px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;overflow:visible}.expression{max-height:116px;line-height:1.45;align-self:stretch;min-width:0}.expression{grid-column:1;grid-row:1;min-height:40px;max-height:100px;overflow-y:auto;overflow-wrap:anywhere;white-space:normal;line-height:1.4}.rounded-label{display:none;grid-column:2;grid-row:1;align-self:end;text-align:right;color:#d33;font-size:14px;white-space:nowrap}.display{grid-column:2;grid-row:2;font-size:clamp(28px,8vw,38px);text-align:right}.readout:has(.rounded-label.visible) .display{grid-row:2}.readout:has(.rounded-label.visible) .expression{grid-row:1 / span 2}.keys{gap:10px}.keys button{height:clamp(54px,13vw,66px);border-radius:13px}@media(max-width:380px){.calculator{padding:12px}.tools{grid-template-columns:minmax(0,1fr) 118px}.tool-cell{gap:4px;padding:5px}.rate-label{font-size:11px}.rate-input{width:58px}.tool-button{font-size:12px}.keys{gap:7px}}</style>
</head>
<body><main class="calculator" aria-label="计算器"><header class="top"><div class="brand">简易计算器</div><div class="mode">标准</div><div class="memory"><button title="清除记忆" onclick="memory=0">MC</button><button title="记忆加" onclick="memory+=Number(current)||0">M+</button></div></header><section class="screen" aria-live="polite"><div class="tools"><div class="tool-cell"><label class="rate-label" for="rate">汇率</label><input id="rate" class="rate-input" type="number" min="0" step="any" value="1"><button id="lockRate" class="tool-button" type="button">🔓 解锁</button></div><div class="tool-cell"><button id="clearContent" class="tool-button" type="button">清空内容</button><button id="copyResult" class="tool-button" type="button">复制结果</button></div></div><div class="readout"><div class="expression" id="expression"></div><div class="rounded-label" id="roundedLabel">四舍五入后结果</div><div class="display" id="display">0</div></div></section><section class="keys">
<button class="clear" data-action="clear">AC</button><button data-action="sign">±</button><button data-action="percent">%</button><button class="op" data-op="÷">÷</button>
<button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="op" data-op="×">×</button>
<button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="op" data-op="−">−</button>
<button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="op" data-op="+">+</button>
<button class="zero" data-digit="0">0</button><button data-action="decimal">.</button><button class="equal" data-action="equals">=</button>
</section></main>
<script>
let current='0',stored=null,operator=null,replace=true,memory=0,rateLocked=false,history='',justCalculated=false;const rateInput=document.querySelector('#rate'),lockRate=document.querySelector('#lockRate');try{const savedRate=localStorage.getItem('calculatorExchangeRate');if(savedRate!==null&&savedRate!=='')rateInput.value=savedRate}catch{}rateInput.addEventListener('input',()=>{try{localStorage.setItem('calculatorExchangeRate',rateInput.value)}catch{}});lockRate.addEventListener('click',()=>{rateLocked=!rateLocked;rateInput.disabled=rateLocked;lockRate.textContent=rateLocked?'🔒 已锁定':'🔓 解锁';if(rateLocked){current='0';stored=null;operator=null;history='';replace=true}render()});document.querySelector('#clearContent').addEventListener('click',()=>{current='0';stored=null;operator=null;history='';replace=true;render()});document.querySelector('#copyResult').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(rateLocked?format(Math.round(Number(current)*Number(rateInput.value))):(justCalculated?format(Number(current)):current));const b=document.querySelector('#copyResult');b.textContent='已复制';setTimeout(()=>b.textContent='复制结果',1000)}catch{const t=document.createElement('textarea');t.value=rateLocked?format(Math.round(Number(current)*Number(rateInput.value))):(justCalculated?format(Number(current)):current);document.body.append(t);t.select();document.execCommand('copy');t.remove()}});const display=document.querySelector('#display'),expression=document.querySelector('#expression'),roundedLabel=document.querySelector('#roundedLabel');function format(n){return Number.isFinite(n)?Number(n.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:12}):'错误'}function render(){if(rateLocked){const rate=Number(rateInput.value),amount=Number(current);if(justCalculated){display.textContent=format(Math.round(rate*amount));expression.textContent=rateInput.value+' × '+current+' = '+format(rate*amount);roundedLabel.style.display='block'}else{display.textContent=current;expression.textContent=rateInput.value+' × '+current;roundedLabel.style.display='none'}}else{roundedLabel.style.display='none';display.textContent=justCalculated?format(Number(current)):current;expression.textContent=history+(operator!==null&&!replace?current:'')}}function calc(a,b,op){switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b}}function inputDigit(d){if(replace){if(justCalculated){history='';stored=null;operator=null;justCalculated=false}current=d;replace=false}else if(current.length<14)current=current==='0'?d:current+d;render()}function chooseOp(op){if(rateLocked)return;justCalculated=false;const n=Number(current);if(operator&&stored!==null&&!replace){history+=current+' '+op+' ';stored=calc(stored,n,operator);current=String(stored)}else{stored=n;if(!history)history=current+' '+op+' ';else history+=current+' '+op+' '}operator=op;replace=true;render()}function equals(){if(rateLocked){justCalculated=true;replace=true;render();return}if(operator===null||stored===null)return;const a=stored,b=Number(current),result=calc(a,b,operator);current=Number.isFinite(result)?String(Number(result.toPrecision(12))):'错误';history+=b+' = '+format(Number(current));stored=null;operator=null;replace=true;justCalculated=true;render()}document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)inputDigit(b.dataset.digit);else if(b.dataset.op)chooseOp(b.dataset.op);else switch(b.dataset.action){case 'clear':current='0';stored=null;operator=null;history='';replace=true;render();break;case 'decimal':if(replace){current='0.';replace=false}else if(!current.includes('.'))current+='.';render();break;case 'sign':if(current!=='0'&&current!=='错误')current=String(-Number(current));render();break;case 'percent':current=String(Number(current)/100);render();break;case 'equals':equals()}});document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))inputDigit(e.key);else if(e.key==='.')document.querySelector('[data-action="decimal"]').click();else if(['+','-','*','/'].includes(e.key))chooseOp(({'+':'+','-':'−','*':'×','/':'÷'})[e.key]);else if(e.key==='Enter'||e.key==='=')equals();else if(e.key==='Escape')document.querySelector('[data-action="clear"]').click();else if(e.key==='Backspace'){current=current.length>1?current.slice(0,-1):'0';render()}});
</script></body></html>
